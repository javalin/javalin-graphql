<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GraphiQL</title>
    <style>
        body {
            height: 100%;
            margin: 0;
            width: 100%;
            overflow: hidden;
        }

        #graphiql {
            height: 100vh;
        }
    </style>

    <!--
      Every asset is pinned by version and by content hash. graphiql 4.1.2 is the last release
      that publishes a UMD bundle (5.x is ESM only) and react 18.3.1 is the last that publishes
      UMD builds (19.x does not), so this pair is the newest combination that works from a plain
      script tag with no bundler. The graphiql bundle also contains @graphiql/toolkit, graphql-js
      and graphql-ws, so nothing else has to be loaded.
    -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/graphiql@4.1.2/graphiql.min.css"
        integrity="sha384-1el1QShFBnnXTx9x/Cprg82hZWKt0ry29OAYIXt05swbi0KcZDFoj0CWguMpopJr"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
</head>

<body>
<div id="graphiql">Loading...</div>

<script
    src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
></script>
<script
    src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
></script>
<script
    src="https://unpkg.com/graphiql@4.1.2/graphiql.min.js"
    integrity="sha384-9XdHu7ajgGJziD4J1zNBKQ842Q/+zZfDv+ib1eMhZWBH6hPAs806x+Jbcf0yNO6B"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
></script>

<script>
    (function () {
        // The plugin serves this page, the POST endpoint and the subscription WebSocket on one
        // and the same path, whichever path the application chose, so both URLs are derived
        // from the current location rather than baked in. Query string and fragment are dropped.
        var url = window.location.origin + window.location.pathname;
        var subscriptionUrl =
            (window.location.protocol === 'https:' ? 'wss:' : 'ws:') +
            '//' +
            window.location.host +
            window.location.pathname;

        // createFetcher opens the WebSocket only for operations it parses as subscriptions, and
        // speaks graphql-transport-ws over it; queries and mutations keep going over POST.
        var fetcher = GraphiQL.createFetcher({
            url: url,
            subscriptionUrl: subscriptionUrl
        });

        var root = ReactDOM.createRoot(document.getElementById('graphiql'));
        root.render(
            React.createElement(GraphiQL, {
                fetcher: fetcher,
                defaultEditorToolsVisibility: true
            })
        );
    })();
</script>
</body>
</html>
